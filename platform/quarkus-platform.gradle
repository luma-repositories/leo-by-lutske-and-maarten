// =============================================================================
// Centralized dependency version management for the Leo Legacy Quarkus project.
// All dependency versions MUST be declared here.
// Application modules reference versions via this platform file.
// =============================================================================

ext {
    versions = [
        // Quarkus
        quarkus              : '3.17.7',

        // Kotlin
        kotlin               : '2.0.21',

        // LangChain4j (AI / LLM integration)
        quarkusLangchain4j   : '0.26.2',

        // Testing
        restAssured          : '5.5.0',
        mockitoKotlin        : '5.4.0',
    ]

    libs = [
        // Quarkus BOM (imported as a platform in build.gradle.kts)
        quarkusBom              : "io.quarkus.platform:quarkus-bom:${versions.quarkus}",

        // Quarkus extensions
        quarkusRest             : 'io.quarkus:quarkus-rest',
        quarkusRestJackson      : 'io.quarkus:quarkus-rest-jackson',
        quarkusArc              : 'io.quarkus:quarkus-arc',
        quarkusKotlin           : 'io.quarkus:quarkus-kotlin',

        // Database
        quarkusHibernateOrm     : 'io.quarkus:quarkus-hibernate-orm-panache-kotlin',
        quarkusJdbcPostgresql   : 'io.quarkus:quarkus-jdbc-postgresql',
        quarkusFlyway           : 'io.quarkus:quarkus-flyway',

        // LangChain4j — AI model providers
        langchain4jOpenai       : "io.quarkiverse.langchain4j:quarkus-langchain4j-openai:${versions.quarkusLangchain4j}",
        langchain4jAnthropic    : "io.quarkiverse.langchain4j:quarkus-langchain4j-anthropic:${versions.quarkusLangchain4j}",

        // Testing
        quarkusJunit5           : 'io.quarkus:quarkus-junit5',
        quarkusMockito          : 'io.quarkus:quarkus-junit5-mockito',
        quarkusTestH2           : 'io.quarkus:quarkus-jdbc-h2',
        restAssured             : "io.rest-assured:rest-assured:${versions.restAssured}",
    ]
}
