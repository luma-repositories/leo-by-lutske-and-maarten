# =============================================================================
# Test profile configuration — uses H2 in-memory database
# =============================================================================

quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.datasource.devservices.enabled=false

app.version=1.2.3

# --- AI config (tests use mocked RecipeExtractionService) ---
app.ai.provider=openai
app.ai.model=gpt-4o-test
app.ai.api-key=test-key-not-real
app.ai.timeout-seconds=10
app.ai.temperature=0.1
app.ai.max-tokens=4096

# --- Disable LangChain4j Quarkus auto-config ---
quarkus.langchain4j.openai.enable-integration=false
quarkus.langchain4j.anthropic.enable-integration=false

# --- HTTP body size limit ---
quarkus.http.limits.max-body-size=10M
