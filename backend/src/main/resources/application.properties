# =============================================================================
# Leo Legacy — Quarkus application configuration
# =============================================================================

# Application version (exposed via GET /api/version)
app.version=1.2.3

# --- Datasource (PostgreSQL via compose.yaml) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=leo
quarkus.datasource.password=leo_secret
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/leo_legacy

# --- Hibernate ORM ---
quarkus.hibernate-orm.database.generation=none

# --- Flyway ---
quarkus.flyway.migrate-at-start=true

# --- Dev Services OFF (we use compose) ---
quarkus.datasource.devservices.enabled=false

# --- HTTP body size limit (for image uploads) ---
quarkus.http.limits.max-body-size=10M

# =============================================================================
# AI / LLM Configuration (LangChain4j)
# =============================================================================
# Supported providers: openai, claude, vllm
# Switch provider by changing app.ai.provider (or use Quarkus profiles).
#
# Examples:
#   %dev.app.ai.provider=vllm
#   %dev.app.ai.base-url=http://localhost:8000/v1
#   %prod.app.ai.provider=openai

app.ai.provider=openai
app.ai.model=gpt-4o
app.ai.api-key=${AI_API_KEY:dummy-key-for-dev}
# app.ai.base-url=http://localhost:8000/v1  # Required for vllm provider
app.ai.timeout-seconds=120
app.ai.temperature=0.1
app.ai.max-tokens=4096

# --- Disable LangChain4j Quarkus auto-config (we use manual ChatModel producer) ---
quarkus.langchain4j.openai.enable-integration=false
quarkus.langchain4j.anthropic.enable-integration=false
