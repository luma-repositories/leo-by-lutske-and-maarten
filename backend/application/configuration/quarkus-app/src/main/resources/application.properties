# =============================================================================
# Leo Legacy — Quarkus application configuration
# =============================================================================

app.version=1.2.3

# --- Datasource (PostgreSQL via compose.yaml) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=leo
quarkus.datasource.password=leo_secret
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/leo_legacy

# --- Hibernate ORM ---
quarkus.hibernate-orm.database.generation=none

# --- Flyway ---
quarkus.flyway.migrate-at-start=true

# --- Dev Services OFF (we use compose) ---
quarkus.datasource.devservices.enabled=false

# --- HTTP ---
quarkus.http.enable-compression=true
quarkus.http.limits.max-body-size=10M

# --- Jandex: index application submodules for CDI bean discovery ---
quarkus.index-dependency.domain.group-id=leo-legacy
quarkus.index-dependency.domain.artifact-id=backend-application-core-domain
quarkus.index-dependency.ports.group-id=leo-legacy
quarkus.index-dependency.ports.artifact-id=backend-application-core-ports
quarkus.index-dependency.usecases.group-id=leo-legacy
quarkus.index-dependency.usecases.artifact-id=backend-application-core-usecases
quarkus.index-dependency.postgres.group-id=leo-legacy
quarkus.index-dependency.postgres.artifact-id=backend-application-infrastructure-persistence-postgres
quarkus.index-dependency.http-clients.group-id=leo-legacy
quarkus.index-dependency.http-clients.artifact-id=backend-application-infrastructure-gateways-http-clients
quarkus.index-dependency.jakarta-apis.group-id=leo-legacy
quarkus.index-dependency.jakarta-apis.artifact-id=backend-application-apis-jakarta-apis

# =============================================================================
# AI / LLM Configuration (LangChain4j)
# =============================================================================
app.ai.provider=openai
app.ai.model=gpt-5.4
app.ai.api-key=${AI_API_KEY:dummy-key-for-dev}
app.ai.timeout-seconds=120
app.ai.temperature=0.1
app.ai.max-tokens=4096
