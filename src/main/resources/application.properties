app.version=1.2.3

quarkus.http.port=8080
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${APP_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/leolegacy}
quarkus.datasource.username=${APP_DATASOURCE_USERNAME:leolegacy}
quarkus.datasource.password=${APP_DATASOURCE_PASSWORD:leolegacy}

%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/leolegacy
%dev.quarkus.datasource.username=leolegacy
%dev.quarkus.datasource.password=leolegacy

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${APP_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/leolegacy}
%prod.quarkus.datasource.username=${APP_DATASOURCE_USERNAME:leolegacy}
%prod.quarkus.datasource.password=${APP_DATASOURCE_PASSWORD:leolegacy}

quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

app.import.max-file-size-bytes=${APP_IMPORT_MAX_FILE_SIZE_BYTES:8388608}
app.import.allowed-mime-types=${APP_IMPORT_ALLOWED_MIME_TYPES:image/png,image/jpeg,image/jpg,image/webp}
app.import.allowed-extensions=${APP_IMPORT_ALLOWED_EXTENSIONS:png,jpg,jpeg,webp}
app.import.ocr.language=${APP_IMPORT_OCR_LANGUAGE:eng}
app.import.ocr.tessdata-path=${TESSDATA_PREFIX:/usr/share/tessdata}
app.import.ocr.stub-text=${APP_IMPORT_OCR_STUB_TEXT:}
app.import.default-source=Imported from image

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:leolegacy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.app.import.ocr.stub-text=Scanned recipe
